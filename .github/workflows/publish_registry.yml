name: Publish CRUN to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crun-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher credential
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Add this publisher's REGISTRY_ACCESS_TOKEN repository secret before publishing."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*frontend*.mjs
      - run: python scripts/build_release.py
      - name: Publish verified checkout
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
